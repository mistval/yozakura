name: Release Artifacts

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

concurrency:
  group: release-artifacts-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Ensure GitHub release exists
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists for tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yozakura:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/yozakura:latest

  electron:
    name: Electron build (${{ matrix.os }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Build frontend
        run: npm run build:web

      - name: Build backend
        run: npm run build:server

      - name: Rebuild native modules against Electron
        shell: bash
        run: ./server/node_modules/.bin/electron-rebuild -m ./server -w better-sqlite3 -f

      - name: Build Electron distributables
        run: npm run electron:make

      - name: Upload build artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: electron_out/make/**
          if-no-files-found: error

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: electron_out/make/**
          fail_on_unmatched_files: true
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
