name: Release Artifacts

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

concurrency:
  group: release-artifacts-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Ensure GitHub release exists
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists for tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yozakura

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  electron:
    name: Electron build (${{ matrix.os }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Build frontend
        run: npm run build:web

      - name: Build backend
        run: npm run build:server

      - name: Rebuild native modules against Electron
        shell: bash
        run: ./server/node_modules/.bin/electron-rebuild -m ./server -w better-sqlite3 -f

      - name: Build Electron distributables
        run: npm run electron:make

      - name: Debug - list build output
        if: always()
        shell: bash
        run: |
          echo "=== working directory: $(pwd) ==="
          ls -la
          echo "=== electron_out contents ==="
          if [ -d electron_out ]; then
            find electron_out -maxdepth 4
          else
            echo "electron_out/ DOES NOT EXIST"
          fi
          echo "=== any out/make dirs elsewhere (excluding node_modules) ==="
          find . -maxdepth 3 -name node_modules -prune -o -type d \( -name make -o -name out -o -name electron_out \) -print
          echo "=== any zip files (excluding node_modules) ==="
          find . -maxdepth 5 -name node_modules -prune -o -name "*.zip" -print

      - name: Upload build artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: electron_out/make/**
          if-no-files-found: error

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: electron_out/make/**
          fail_on_unmatched_files: true
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
